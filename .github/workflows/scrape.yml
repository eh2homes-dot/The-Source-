# Daily job scrape — CLOUD refresh (runs on GitHub's servers, 24/7).
#
# This is the production-grade companion to the local macOS scheduler. It is
# INACTIVE until you:
#   1. Push this project to a GitHub repository.
#   2. In the repo: Settings → Secrets and variables → Actions → add two secrets:
#        SUPABASE_URL          = https://ddajpnfxoirbhrithlfh.supabase.co
#        SUPABASE_SERVICE_KEY  = (your Supabase secret/service_role key)
# Then it runs every day automatically and you can also trigger it by hand from
# the repo's "Actions" tab ("Run workflow").
#
# Note: this does NOT use a committed .env (we never commit secrets) — it reads
# the keys from the GitHub secrets above.

name: Daily job scrape

on:
  schedule:
    - cron: "0 11 * * *" # 11:00 UTC daily (~6 AM US Central)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-24.04 # pinned: Playwright does not support ubuntu-latest (26.04) yet
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for Workday operators)
        run: npx playwright install --with-deps chromium

      - name: Scrape real jobs into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node run.js
